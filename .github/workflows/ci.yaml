name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check latest commit with Cocogitto
        uses: cocogitto/cocogitto-action@v3
        with:
          check: true
        env:
          COG_FROM: HEAD~1
          COG_TO: HEAD
